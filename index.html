<!DOCTYPE html>
<html class="light" lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Tactile Playroom - Cute Tetris</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="style.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-container": "#bdfac4",
                      "on-tertiary-fixed-variant": "#356c42",
                      "error-container": "#f74b6d",
                      "surface": "#fbf5f7",
                      "on-error": "#ffefef",
                      "outline": "#797678",
                      "secondary-dim": "#2d546c",
                      "outline-variant": "#b0acae",
                      "error-dim": "#a70138",
                      "surface-tint": "#824a64",
                      "on-background": "#302e30",
                      "tertiary-fixed-dim": "#afebb6",
                      "primary-container": "#fdb5d3",
                      "secondary-container": "#b8dffd",
                      "primary-dim": "#753e58",
                      "surface-dim": "#d9d3d6",
                      "surface-container-high": "#e7e1e4",
                      "surface-container-low": "#f5eff1",
                      "on-secondary": "#e9f4ff",
                      "background": "#fbf5f7",
                      "secondary": "#396079",
                      "primary-fixed-dim": "#eda7c5",
                      "tertiary": "#2f663d",
                      "on-secondary-fixed-variant": "#345a73",
                      "surface-container": "#ece7e9",
                      "primary": "#824a64",
                      "tertiary-fixed": "#bdfac4",
                      "inverse-surface": "#0f0e0f",
                      "error": "#b41340",
                      "on-primary-fixed-variant": "#6f3a53",
                      "on-secondary-fixed": "#133e56",
                      "surface-bright": "#fbf5f7",
                      "on-surface-variant": "#5e5b5c",
                      "primary-fixed": "#fdb5d3",
                      "inverse-primary": "#fdb5d3",
                      "on-error-container": "#510017",
                      "tertiary-dim": "#235a32",
                      "on-primary-container": "#65314a",
                      "secondary-fixed-dim": "#aad1ee",
                      "secondary-fixed": "#b8dffd",
                      "on-tertiary": "#ceffd2",
                      "on-tertiary-container": "#2a6239",
                      "on-tertiary-fixed": "#164f28",
                      "on-primary-fixed": "#4d1d36",
                      "surface-container-lowest": "#ffffff",
                      "on-surface": "#302e30",
                      "surface-container-highest": "#e1dbde",
                      "on-primary": "#ffeff3",
                      "inverse-on-surface": "#a09c9e",
                      "on-secondary-container": "#295169",
                      "surface-variant": "#e1dbde"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Plus Jakarta Sans"],
                      "body": ["Be Vietnam Pro"],
                      "label": ["Plus Jakarta Sans"]
              }
            },
          },
        }
    </script>
</head>
<body class="bg-surface text-on-surface selection:bg-primary-container min-h-screen flex flex-col overflow-x-hidden">
    <!-- SVG Wobbly Filters -->
    <svg class="hidden">
        <defs>
            <filter id="wobble">
                <feturbulence basefrequency="0.02" numoctaves="3" result="noise" seed="1" type="fractalNoise"></feturbulence>
                <fedisplacementmap in="SourceGraphic" in2="noise" scale="3"></fedisplacementmap>
            </filter>
        </defs>
    </svg>

    <!-- TopNavBar -->
    <nav class="bg-[#fbf5f7]/80 backdrop-blur-sm w-full top-0 px-8 py-4 font-headline tracking-tight z-10 border-b border-surface-container-high">
        <div class="flex justify-between items-center max-w-7xl mx-auto">
            <div class="text-2xl font-bold text-on-surface tracking-widest uppercase italic">
                Tactile Playroom
            </div>
            <div class="hidden md:flex gap-10 items-center">
                <a class="text-on-surface opacity-60 hover:opacity-100 hover:scale-95 transition-all" href="#">How to Play</a>
                <a class="text-on-surface opacity-60 hover:opacity-100 hover:scale-95 transition-all" href="#">Leaderboard</a>
                <a class="text-on-surface opacity-60 hover:opacity-100 hover:scale-95 transition-all" id="settings-btn" href="#">Settings</a>
            </div>
            <div class="flex items-center gap-4">
                <button class="material-symbols-outlined text-primary hover:scale-110 transition-transform" data-icon="account_circle">account_circle</button>
            </div>
        </div>
    </nav>

    <!-- Main Game Canvas Area -->
    <main class="flex-grow flex items-center justify-center p-4 md:p-8">
        <div class="max-w-7xl w-full grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
            
            <!-- Left Side: Hold & Stats -->
            <div class="md:col-span-3 space-y-6 order-2 md:order-1 self-center">
                <!-- Hold Piece -->
                <div class="bg-surface-container-low rounded-lg p-6 flex flex-col items-center border-b-4 border-surface-container-highest">
                    <span class="label-caps text-xs font-bold tracking-widest text-on-surface-variant mb-4 uppercase">Hold Piece</span>
                    <div id="hold-piece-container" class="w-24 h-24 bg-surface-container-lowest rounded-md flex items-center justify-center border-4 border-surface-container-high border-dotted relative">
                        <span class="material-symbols-outlined text-outline-variant text-4xl" data-icon="back_hand">back_hand</span>
                    </div>
                    <div class="mt-2 text-[10px] font-bold text-outline-variant uppercase">[C] KEY</div>
                </div>
                <!-- Mini Stats Card -->
                <div class="bg-surface-container-low rounded-lg p-6 space-y-6 border-b-8 border-surface-container-highest">
                    <div>
                        <span class="label-caps text-xs font-bold tracking-widest text-on-surface-variant uppercase">Current Score</span>
                        <div id="score-value-ui" class="text-4xl font-black text-primary tracking-tighter">000,000</div>
                    </div>
                    <div class="flex justify-between items-center bg-surface-container p-4 rounded-xl">
                        <div>
                            <span class="label-caps text-[10px] font-bold tracking-widest text-on-surface-variant uppercase italic">Level</span>
                            <div id="level-value-ui" class="text-xl font-black text-on-surface">01</div>
                        </div>
                        <div class="text-right">
                            <span class="label-caps text-[10px] font-bold tracking-widest text-on-surface-variant uppercase italic">Lines</span>
                            <div id="lines-value-ui" class="text-xl font-black text-on-surface">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Center Spot: Game Board & On-Screen Buttons -->
            <div class="md:col-span-6 flex flex-col items-center order-1 md:order-2 space-y-8">
                <div class="relative bg-surface-container-high rounded-xl p-4 shadow-2xl border-4 border-surface-container-highest">
                    
                    <!-- Game Over / Pause Overlay -->
                    <div id="overlay" class="absolute inset-0 z-50 bg-surface/90 backdrop-blur-lg rounded-xl flex flex-col items-center justify-center space-y-6 transition-all duration-500">
                        <h2 id="overlay-title" class="text-6xl font-black text-primary tracking-tighter uppercase italic">Ready?</h2>
                        <button id="start-btn" class="group flex items-center justify-between w-64 p-6 bg-primary-container rounded-lg hover:scale-[0.96] transition-transform duration-200 active:scale-95 shadow-lg border-b-4 border-primary/20">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 bg-primary/10 rounded-full flex items-center justify-center">
                                    <span class="material-symbols-outlined text-primary text-3xl" data-icon="play_circle" style="font-variation-settings: 'FILL' 1;">play_circle</span>
                                </div>
                                <div class="text-left">
                                    <span class="font-headline font-extrabold text-on-primary-container block text-lg">Start Game</span>
                                    <span class="label-caps text-[10px] uppercase tracking-wider text-on-primary-container/70 font-bold">Mochi Drop</span>
                                </div>
                            </div>
                            <span class="text-2xl text-on-primary-container opacity-80 font-black">;)</span>
                        </button>
                    </div>

                    <!-- Phaser Board Area: matches 320x640 -->
                    <div id="game-container" class="tetris-grid w-[320px] h-[640px] bg-surface-container-lowest rounded-lg relative overflow-hidden shadow-inner">
                        <!-- Phaser renders here -->
                    </div>
                </div>

                <!-- D-Pad Buttons Group (Mobile Friendly) -->
                <div class="flex items-center gap-8 bg-surface-container-low p-4 px-10 rounded-full shadow-inner border border-surface-container-high">
                    <button id="btn-hold" class="w-14 h-14 bg-surface-container-highest rounded-xl spring-active flex flex-col items-center justify-center text-on-surface shadow-sm hover:bg-surface-container-high transition-colors hand-drawn-border wobbly-line">
                        <span class="material-symbols-outlined text-xl">back_hand</span>
                        <span class="text-[8px] font-bold uppercase tracking-widest mt-1 opacity-40">HOLD</span>
                    </button>
                    
                    <div class="grid grid-cols-3 grid-rows-2 gap-3">
                        <button id="btn-rotate" class="col-start-2 row-start-1 w-14 h-14 bg-white rounded-full spring-active flex flex-col items-center justify-center shadow-md text-primary border-2 border-primary/20 hover:scale-110 transition-all hand-drawn-border wobbly-line">
                            <span class="material-symbols-outlined text-xl leading-none">keyboard_arrow_up</span>
                            <span class="text-[9px] font-black mt-[-4px]">:)</span>
                        </button>
                        <button id="btn-left" class="col-start-1 row-start-2 w-14 h-14 bg-white rounded-full spring-active flex flex-col items-center justify-center shadow-md text-primary border-2 border-primary/20 hover:scale-110 transition-all hand-drawn-border wobbly-line">
                            <span class="material-symbols-outlined text-xl leading-none">keyboard_arrow_left</span>
                            <span class="text-[9px] font-black mt-[-4px]">:/</span>
                        </button>
                        <button id="btn-down" class="col-start-2 row-start-2 w-14 h-14 bg-white rounded-full spring-active flex flex-col items-center justify-center shadow-md text-primary border-2 border-primary/20 hover:scale-110 transition-all hand-drawn-border wobbly-line">
                            <span class="material-symbols-outlined text-xl leading-none">keyboard_arrow_down</span>
                            <span class="text-[9px] font-black mt-[-4px]">o_o</span>
                        </button>
                        <button id="btn-right" class="col-start-3 row-start-2 w-14 h-14 bg-white rounded-full spring-active flex flex-col items-center justify-center shadow-md text-primary border-2 border-primary/20 hover:scale-110 transition-all hand-drawn-border wobbly-line">
                            <span class="material-symbols-outlined text-xl leading-none">keyboard_arrow_right</span>
                            <span class="text-[9px] font-black mt-[-4px]">;)</span>
                        </button>
                    </div>

                    <button id="btn-drop" class="w-16 h-16 bg-primary text-on-primary rounded-full spring-active flex flex-col items-center justify-center shadow-lg hover:brightness-110 transition-all hand-drawn-border wobbly-line border-white/20">
                        <span class="material-symbols-outlined text-2xl leading-none">keyboard_double_arrow_down</span>
                        <span class="text-[8px] font-black mt-0 tracking-tighter">DROP</span>
                    </button>
                </div>
            </div>

            <!-- Right Side: Next Piece & Decoration -->
            <div class="md:col-span-3 space-y-6 order-3 self-center">
                <!-- Next Piece Container -->
                <div class="bg-surface-container-low rounded-lg p-6 flex flex-col items-center border-b-4 border-surface-container-highest">
                    <span class="label-caps text-xs font-bold tracking-widest text-on-surface-variant mb-4 uppercase">Next Up</span>
                    <div id="next-piece-container" class="w-28 h-28 bg-surface-container-highest/50 rounded-xl flex items-center justify-center relative overflow-hidden">
                        <!-- Next piece icons rendered here if needed via JS or just space -->
                    </div>
                </div>
                <!-- Aesthetic Image -->
                <div class="rounded-xl overflow-hidden aspect-square relative group shadow-sm border-2 border-surface-container-high transform rotate-2 hover:rotate-0 transition-transform duration-500">
                    <img alt="Cute toys decoration" class="w-full h-full object-cover grayscale opacity-50 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-700" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBmafBMpOsnk74oCH3Z_nkfsjfaabMMXiEEaYU7QXwGXkkEVfWvIJUbBF8n_9gVTMu6cKQHgKzTrXKrqgejYtIbFFo8Re9S4nlifvh3h2vaz04HcUPnJhIq3ejX8cYJ61i8wTxdlA72RcjP2ukaY6U60xkXxmLt-eTwQq1Ko7xB4B9_RaMdLlpVIbYpOLBEwiYQ7cTaYLnZKrwGKbQf6d4tvM9LjitlycYktkQulV_Dn7waEThYSWcQ-5SfJU44vFeFZY1M1x4Oag"/>
                    <div class="absolute inset-0 bg-gradient-to-t from-surface-container-low/80 to-transparent"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Meta -->
    <footer class="bg-surface-container-low w-full py-8 px-6 flex flex-col md:flex-row justify-between items-center gap-4 text-sm font-body tracking-wide opacity-50 italic mt-auto">
        <div>© 2024 Tactile Playroom :)</div>
        <div class="flex gap-8">
            <a class="hover:text-primary transition-colors" href="#">Support</a>
            <a class="hover:text-primary transition-colors" href="#">Privacy</a>
            <a class="hover:text-primary transition-colors" href="#">Blocks Gallery</a>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="game.js"></script>
</body>
</html>
