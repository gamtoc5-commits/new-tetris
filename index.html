<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Tactile Playroom - Cute Tetris</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-container": "#bdfac4",
                      "on-tertiary-fixed-variant": "#356c42",
                      "error-container": "#f74b6d",
                      "surface": "#fbf5f7",
                      "on-error": "#ffefef",
                      "outline": "#797678",
                      "secondary-dim": "#2d546c",
                      "outline-variant": "#b0acae",
                      "error-dim": "#a70138",
                      "surface-tint": "#824a64",
                      "on-background": "#302e30",
                      "tertiary-fixed-dim": "#afebb6",
                      "primary-container": "#fdb5d3",
                      "secondary-container": "#b8dffd",
                      "primary-dim": "#753e58",
                      "surface-dim": "#d9d3d6",
                      "surface-container-high": "#e7e1e4",
                      "surface-container-low": "#f5eff1",
                      "on-secondary": "#e9f4ff",
                      "background": "#fbf5f7",
                      "secondary": "#396079",
                      "primary-fixed-dim": "#eda7c5",
                      "tertiary": "#2f663d",
                      "on-secondary-fixed-variant": "#345a73",
                      "surface-container": "#ece7e9",
                      "primary": "#824a64",
                      "tertiary-fixed": "#bdfac4",
                      "inverse-surface": "#0f0e0f",
                      "error": "#b41340",
                      "on-primary-fixed-variant": "#6f3a53",
                      "on-secondary-fixed": "#133e56",
                      "surface-bright": "#fbf5f7",
                      "on-surface-variant": "#5e5b5c",
                      "primary-fixed": "#fdb5d3",
                      "inverse-primary": "#fdb5d3",
                      "on-error-container": "#510017",
                      "tertiary-dim": "#235a32",
                      "on-primary-container": "#65314a",
                      "secondary-fixed-dim": "#aad1ee",
                      "secondary-fixed": "#b8dffd",
                      "on-tertiary": "#ceffd2",
                      "on-tertiary-container": "#2a6239",
                      "on-tertiary-fixed": "#164f28",
                      "on-primary-fixed": "#4d1d36",
                      "surface-container-lowest": "#ffffff",
                      "on-surface": "#302e30",
                      "surface-container-highest": "#e1dbde",
                      "on-primary": "#ffeff3",
                      "inverse-on-surface": "#a09c9e",
                      "on-secondary-container": "#295169",
                      "surface-variant": "#e1dbde"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Plus Jakarta Sans"],
                      "body": ["Be Vietnam Pro"],
                      "label": ["Plus Jakarta Sans"]
              }
            },
          },
        }
    </script>
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        h1, h2, h3, .label-caps { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .tetris-grid {
            background-image: radial-gradient(circle, #e1dbde 2px, transparent 2px);
            background-size: 32px 32px;
        }
        .block-face {
            font-size: 14px;
            line-height: 1;
            letter-spacing: -1px;
        }
        .spring-active:active {
            transform: scale(0.92);
            transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .hand-drawn-border {
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            border: 2px solid currentColor;
        }
        .wobbly-line {
            filter: url(#wobble);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-surface text-on-surface selection:bg-primary-container min-h-screen flex flex-col overflow-x-hidden">
    <svg class="hidden">
        <defs>
            <filter id="wobble">
                <feturbulence basefrequency="0.02" numoctaves="3" result="noise" seed="1" type="fractalNoise"></feturbulence>
                <fedisplacementmap in="SourceGraphic" in2="noise" scale="3"></fedisplacementmap>
            </filter>
        </defs>
    </svg>

    <!-- Floating Background Elements -->
    <div class="fixed inset-0 pointer-events-none z-0 opacity-20">
        <div class="absolute top-20 left-[10%] w-16 h-16 bg-primary-container rounded-sm rotate-12 flex items-center justify-center">
            <span class="text-on-primary-container font-bold text-xl">:)</span>
        </div>
        <div class="absolute top-[40%] right-[5%] w-20 h-12 bg-secondary-container rounded-sm -rotate-6 flex items-center justify-center">
            <span class="text-on-secondary-container font-bold text-xl">;)</span>
        </div>
        <div class="absolute bottom-20 left-[15%] w-12 h-24 bg-tertiary-container rounded-sm rotate-45 flex items-center justify-center">
            <span class="text-on-tertiary-container font-bold text-xl">:0</span>
        </div>
    </div>

    <!-- TopNavBar: Centered as in screenshot -->
    <nav class="bg-[#fbf5f7]/80 backdrop-blur-sm w-full top-0 px-8 py-6 font-headline tracking-tighter z-10">
        <div class="flex justify-between items-center max-w-7xl mx-auto relative">
            <div class="flex-1 hidden md:block"></div>
            <div class="text-3xl font-black text-[#302e30] tracking-widest uppercase italic absolute left-1/2 -translate-x-1/2">
                Tactile Playroom
            </div>
            <div class="flex items-center gap-4 ml-auto">
                <button class="material-symbols-outlined text-primary hover:scale-110 transition-transform" data-icon="account_circle">account_circle</button>
            </div>
        </div>
    </nav>

    <!-- Main Game Canvas -->
    <main class="flex-grow flex items-center justify-center p-4 md:p-8 z-10">
        <div class="max-w-7xl w-full grid grid-cols-1 md:grid-cols-12 gap-12 items-center">
            
            <!-- Left Side: Hold & Stats -->
            <div class="md:col-span-3 space-y-8 order-2 md:order-1">
                <div class="bg-surface-container-low rounded-[2rem] p-8 flex flex-col items-center shadow-sm border-b-8 border-surface-container-highest">
                    <span class="label-caps text-xs font-bold tracking-[0.2em] text-outline mb-6 uppercase">Hold Piece</span>
                    <div id="hold-piece-container" class="w-24 h-24 bg-white rounded-2xl flex items-center justify-center border-4 border-surface-container-high border-dotted relative">
                        <span class="material-symbols-outlined text-outline-variant text-4xl" data-icon="back_hand">back_hand</span>
                    </div>
                    <span class="text-[10px] font-bold text-outline-variant mt-4 uppercase">[C] KEY</span>
                </div>
                <div class="bg-surface-container-low rounded-[2rem] p-8 space-y-8 shadow-sm border-b-8 border-surface-container-highest">
                    <div>
                        <span class="label-caps text-xs font-bold tracking-[0.2em] text-outline mb-2 uppercase">Current Score</span>
                        <div id="score-value-ui" class="text-5xl font-black text-primary tracking-tighter">000,000</div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white p-4 rounded-2xl border-b-4 border-surface-container-high">
                            <span class="label-caps text-[10px] font-bold tracking-widest text-outline uppercase">Level</span>
                            <div id="level-value-ui" class="text-2xl font-black text-on-surface">01</div>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border-b-4 border-surface-container-high text-right">
                            <span class="label-caps text-[10px] font-bold tracking-widest text-outline uppercase">Lines</span>
                            <div id="lines-value-ui" class="text-2xl font-black text-on-surface">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Center: Game Board (The Frame) -->
            <div class="md:col-span-6 flex flex-col items-center order-1 md:order-2">
                <div class="relative bg-white rounded-[3rem] p-6 shadow-[0_32px_64px_-16px_rgba(48,46,48,0.12)] border-[12px] border-surface-container-highest/30">
                    
                    <!-- Game Over / Pause Overlay -->
                    <div id="overlay" class="absolute inset-0 z-50 bg-surface/90 backdrop-blur-xl rounded-[2.5rem] flex flex-col items-center justify-center space-y-8 transition-all duration-500">
                        <div class="text-6xl font-black text-primary tracking-tighter uppercase italic leading-none mb-4 text-center" id="overlay-title">Ready?</div>
                        <button id="start-btn" class="group flex items-center justify-between w-72 p-6 bg-primary-container rounded-2xl hover:scale-[0.96] transition-all duration-200 active:scale-95 shadow-xl border-b-8 border-primary/20">
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 bg-white/40 rounded-full flex items-center justify-center">
                                    <span class="material-symbols-outlined text-primary text-4xl" data-icon="play_circle" style="font-variation-settings: 'FILL' 1;">play_circle</span>
                                </div>
                                <div class="text-left">
                                    <span class="font-headline font-black text-on-primary-container block text-xl">Start Game</span>
                                    <span class="label-caps text-[10px] uppercase tracking-wider text-on-primary-container/70 font-bold">Mochi Master ;)</span>
                                </div>
                            </div>
                        </button>
                    </div>

                    <!-- Canvas Container with Dot Grid -->
                    <div id="game-container" class="tetris-grid w-[320px] h-[640px] bg-surface-container-lowest rounded-2xl relative overflow-hidden">
                        <!-- Phaser Renders Here -->
                    </div>
                </div>

                <!-- Custom D-Pad: Wide Pill Shape as in Screenshot -->
                <div class="mt-12 bg-surface-container-low p-6 px-12 rounded-full shadow-inner border border-surface-container-high flex items-center gap-10">
                    <button id="btn-hold" class="w-16 h-16 bg-white rounded-full spring-active flex flex-col items-center justify-center text-on-surface shadow-md hover:bg-surface-container-low transition-colors border-4 border-surface-container-high">
                        <span class="material-symbols-outlined text-2xl">back_hand</span>
                        <span class="text-[8px] font-bold uppercase tracking-widest mt-1 opacity-40">HOLD</span>
                    </button>
                    
                    <div class="grid grid-cols-3 gap-4">
                        <div class="col-start-2">
                            <button id="btn-rotate" class="w-14 h-14 bg-white rounded-full spring-active flex items-center justify-center shadow-md text-primary border-4 border-surface-container-high hover:scale-110 transition-transform">
                                <span class="material-symbols-outlined text-3xl font-black">keyboard_arrow_up</span>
                            </button>
                        </div>
                        <button id="btn-left" class="w-14 h-14 bg-white rounded-full spring-active flex items-center justify-center shadow-md text-primary border-4 border-surface-container-high hover:scale-110 transition-transform">
                            <span class="material-symbols-outlined text-3xl font-black">keyboard_arrow_left</span>
                        </button>
                        <button id="btn-down" class="w-14 h-14 bg-white rounded-full spring-active flex items-center justify-center shadow-md text-primary border-4 border-surface-container-high hover:scale-110 transition-transform">
                            <span class="material-symbols-outlined text-3xl font-black">keyboard_arrow_down</span>
                        </button>
                        <button id="btn-right" class="w-14 h-14 bg-white rounded-full spring-active flex items-center justify-center shadow-md text-primary border-4 border-surface-container-high hover:scale-110 transition-transform">
                            <span class="material-symbols-outlined text-3xl font-black">keyboard_arrow_right</span>
                        </button>
                    </div>

                    <button id="btn-drop" class="w-20 h-20 bg-primary text-on-primary rounded-full spring-active flex flex-col items-center justify-center shadow-xl hover:brightness-110 transition-all border-4 border-white/20">
                        <span class="material-symbols-outlined text-3xl font-black">keyboard_double_arrow_down</span>
                        <span class="text-[9px] font-black mt-1 tracking-tighter">DROP</span>
                    </button>
                </div>
            </div>

            <!-- Right Side: Next Up & Bear Card -->
            <div class="md:col-span-3 space-y-8 order-3">
                <div class="bg-surface-container-low rounded-[2rem] p-8 flex flex-col items-center shadow-sm border-b-8 border-surface-container-highest">
                    <span class="label-caps text-xs font-bold tracking-[0.2em] text-outline mb-6 uppercase">Next Up</span>
                    <div id="next-piece-container" class="w-28 h-28 bg-white rounded-2xl flex items-center justify-center relative overflow-hidden transition-all duration-300">
                        <!-- Next piece rendered via JS -->
                    </div>
                </div>
                <div class="rounded-[2.5rem] overflow-hidden aspect-square relative group shadow-sm border-4 border-white shadow-xl transform rotate-2 hover:rotate-0 transition-transform duration-500">
                    <img alt="Cute Bear Illustration" class="w-full h-full object-cover group-hover:scale-110 transition-all duration-700" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBmafBMpOsnk74oCH3Z_nkfsjfaabMMXiEEaYU7QXwGXkkEVfWvIJUbBF8n_9gVTMu6cKQHgKzTrXKrqgejYtIbFFo8Re9S4nlifvh3h2vaz04HcUPnJhIq3ejX8cYJ61i8wTxdlA72RcjP2ukaY6U60xkXxmLt-eTwQq1Ko7xB4B9_RaMdLlpVIbYpOLBEwiYQ7cTaYLnZKrwGKbQf6d4tvM9LjitlycYktkQulV_Dn7waEThYSWcQ-5SfJU44vFeFZY1M1x4Oag"/>
                    <div class="absolute inset-0 bg-gradient-to-t from-surface-container-low/60 to-transparent"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="game.js"></script>
</body>
</html>
