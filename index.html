<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Tactile Playroom - Cute Tetris (400x800)</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-container": "#bdfac4",
                      "on-tertiary-fixed-variant": "#356c42",
                      "error-container": "#f74b6d",
                      "surface": "#fbf5f7",
                      "on-error": "#ffefef",
                      "outline": "#797678",
                      "secondary-dim": "#2d546c",
                      "outline-variant": "#b0acae",
                      "error-dim": "#a70138",
                      "surface-tint": "#824a64",
                      "on-background": "#302e30",
                      "tertiary-fixed-dim": "#afebb6",
                      "primary-container": "#fdb5d3",
                      "secondary-container": "#b8dffd",
                      "primary-dim": "#753e58",
                      "surface-dim": "#d9d3d6",
                      "surface-container-high": "#e7e1e4",
                      "surface-container-low": "#f5eff1",
                      "on-secondary": "#e9f4ff",
                      "background": "#fbf5f7",
                      "secondary": "#396079",
                      "primary-fixed-dim": "#eda7c5",
                      "tertiary": "#2f663d",
                      "on-secondary-fixed-variant": "#345a73",
                      "surface-container": "#ece7e9",
                      "primary": "#824a64",
                      "tertiary-fixed": "#bdfac4",
                      "inverse-surface": "#0f0e0f",
                      "error": "#b41340",
                      "on-primary-fixed-variant": "#6f3a53",
                      "on-secondary-fixed": "#133e56",
                      "surface-bright": "#fbf5f7",
                      "on-surface-variant": "#5e5b5c",
                      "primary-fixed": "#fdb5d3",
                      "inverse-primary": "#fdb5d3",
                      "on-error-container": "#510017",
                      "tertiary-dim": "#235a32",
                      "on-primary-container": "#65314a",
                      "secondary-fixed-dim": "#aad1ee",
                      "secondary-fixed": "#b8dffd",
                      "on-tertiary": "#ceffd2",
                      "on-tertiary-container": "#2a6239",
                      "on-tertiary-fixed": "#164f28",
                      "on-primary-fixed": "#4d1d36",
                      "surface-container-lowest": "#ffffff",
                      "on-surface": "#302e30",
                      "surface-container-highest": "#e1dbde",
                      "on-primary": "#ffeff3",
                      "inverse-on-surface": "#a09c9e",
                      "on-secondary-container": "#295169",
                      "surface-variant": "#e1dbde"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Plus Jakarta Sans"],
                      "body": ["Be Vietnam Pro"],
                      "label": ["Plus Jakarta Sans"]
              }
            },
          },
        }
    </script>
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        h1, h2, h3, .label-caps { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .tetris-grid {
            background-image: radial-gradient(circle, #e1dbde 2px, transparent 2px);
            background-size: 40px 40px;
        }
        .block-face {
            font-size: 16px;
            line-height: 1;
            letter-spacing: -1px;
        }
        .spring-active:active {
            transform: scale(0.92);
            transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .hand-drawn-border {
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            border: 2px solid currentColor;
        }
        .wobbly-line {
            filter: url(#wobble);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-surface text-on-surface selection:bg-primary-container min-h-screen flex flex-col overflow-x-hidden">
    <svg class="hidden">
        <defs>
            <filter id="wobble">
                <feturbulence basefrequency="0.02" numoctaves="3" result="noise" seed="1" type="fractalNoise"></feturbulence>
                <fedisplacementmap in="SourceGraphic" in2="noise" scale="3"></fedisplacementmap>
            </filter>
        </defs>
    </svg>

    <!-- TopNavBar -->
    <nav class="bg-[#fbf5f7]/80 backdrop-blur-sm w-full top-0 px-8 py-4 font-headline tracking-tight z-10 flex justify-between items-center max-w-7xl mx-auto">
        <div class="text-2xl font-bold text-[#302e30] tracking-widest uppercase">
            Tactile Playroom
        </div>
        <div class="hidden md:flex gap-10 items-center">
            <a class="text-[#302e30] opacity-60 hover:scale-95 transition-transform duration-200" href="#">How to Play</a>
            <a class="text-[#302e30] opacity-60 hover:scale-95 transition-transform duration-200" href="#">Leaderboard</a>
            <a class="text-[#302e30] opacity-60 hover:scale-95 transition-transform duration-200" href="#">Settings</a>
        </div>
        <div class="flex items-center gap-4">
            <button class="material-symbols-outlined text-on-surface hover:scale-95 transition-transform duration-200" data-icon="account_circle">account_circle</button>
        </div>
    </nav>

    <!-- Main Game Context -->
    <main class="flex-grow flex items-center justify-center p-4 md:p-8">
        <div class="max-w-7xl w-full grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
            
            <!-- Left Side: Controls & Score & Hold -->
            <div class="md:col-span-3 space-y-8 flex flex-col">
                <!-- Controller Map (Keyboard Instructions) -->
                <div class="bg-surface-container-low/50 hand-drawn-border wobbly-line p-5 rounded-2xl flex flex-col gap-4 border-on-surface-variant/20 italic">
                    <span class="label-caps text-[10px] font-black tracking-[0.2em] text-on-surface-variant uppercase text-center border-b border-on-surface-variant/10 pb-2">Controller Map</span>
                    <div class="grid grid-cols-2 gap-x-4 gap-y-3">
                        <div class="flex items-center gap-2 text-[#302e30]">
                            <span class="px-2 py-0.5 bg-surface-container-lowest rounded-md border border-surface-container-high text-[10px] font-black font-mono shadow-sm">← →</span>
                            <span class="text-[9px] font-bold tracking-wider text-on-surface-variant uppercase">Move</span>
                        </div>
                        <div class="flex items-center gap-2 text-[#302e30]">
                            <span class="px-2 py-0.5 bg-surface-container-lowest rounded-md border border-surface-container-high text-[10px] font-black font-mono shadow-sm">↑</span>
                            <span class="text-[9px] font-bold tracking-wider text-on-surface-variant uppercase">Rotate</span>
                        </div>
                        <div class="flex items-center gap-2 text-[#302e30]">
                            <span class="px-2 py-0.5 bg-surface-container-lowest rounded-md border border-surface-container-high text-[10px] font-black font-mono shadow-sm">↓</span>
                            <span class="text-[9px] font-bold tracking-wider text-on-surface-variant uppercase">Soft</span>
                        </div>
                        <div class="flex items-center gap-2 text-[#302e30]">
                            <span class="px-2 py-0.5 bg-surface-container-lowest rounded-md border border-surface-container-high text-[10px] font-black font-mono shadow-sm">SPCE</span>
                            <span class="text-[9px] font-bold tracking-wider text-on-surface-variant uppercase">Hard</span>
                        </div>
                        <div class="flex items-center gap-2 text-[#302e30]">
                            <span class="px-2 py-0.5 bg-surface-container-lowest rounded-md border border-surface-container-high text-[10px] font-black font-mono shadow-sm">C</span>
                            <span class="text-[9px] font-bold tracking-wider text-on-surface-variant uppercase">Hold</span>
                        </div>
                        <div class="flex items-center gap-2 text-[#302e30]">
                            <span class="px-2 py-0.5 bg-surface-container-lowest rounded-md border border-surface-container-high text-[10px] font-black font-mono shadow-sm">P</span>
                            <span class="text-[9px] font-bold tracking-wider text-on-surface-variant uppercase">Pause</span>
                        </div>
                    </div>
                </div>

                <!-- Hold Slot (Newly added to fit logic) -->
                <div class="bg-surface-container-low rounded-lg p-6 flex flex-col items-center">
                    <span class="label-caps text-xs font-bold tracking-widest text-on-surface-variant mb-4 uppercase">Hold Piece</span>
                    <div id="hold-piece-container" class="w-24 h-24 bg-white rounded-xl flex items-center justify-center border-4 border-surface-container-high border-dotted relative">
                        <span class="material-symbols-outlined text-outline-variant text-4xl" data-icon="back_hand">back_hand</span>
                    </div>
                </div>

                <!-- Score Board -->
                <div class="bg-surface-container-low rounded-lg p-6 space-y-6">
                    <div>
                        <span class="label-caps text-xs font-bold tracking-widest text-on-surface-variant uppercase">Score</span>
                        <div id="score-value-ui" class="text-4xl font-extrabold text-primary tracking-tighter">000,000</div>
                    </div>
                    <div class="flex justify-between items-center bg-surface-container-lowest p-3 rounded-xl border border-surface-container-high">
                        <div>
                            <span class="label-caps text-[10px] font-bold tracking-widest text-on-surface-variant uppercase">Level</span>
                            <div id="level-value-ui" class="text-xl font-bold">01</div>
                        </div>
                        <div class="text-right">
                            <span class="label-caps text-[10px] font-bold tracking-widest text-on-surface-variant uppercase">Lines</span>
                            <div id="lines-value-ui" class="text-xl font-bold">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Center Spot: Game Board & On-Screen Controls -->
            <div class="md:col-span-6 flex flex-col items-center space-y-8">
                <div class="relative bg-surface-container-high rounded-2xl p-5 shadow-2xl">
                    <!-- Overlay -->
                    <div id="overlay" class="absolute inset-0 z-50 bg-surface/80 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center space-y-4">
                        <h2 id="overlay-title" class="text-5xl font-black text-on-surface tracking-tighter italic uppercase">Ready?</h2>
                        <button id="start-btn" class="bg-primary text-on-primary px-10 py-4 rounded-full font-black text-xl hover:scale-95 transition-transform flex items-center gap-3 shadow-xl">
                            <span class="material-symbols-outlined text-3xl" data-icon="play_arrow" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                            Start Game
                        </button>
                    </div>

                    <!-- Phaser Board Area: matches 400x800 -->
                    <div id="game-container" class="tetris-grid w-[400px] h-[800px] bg-surface-container-lowest rounded-lg relative overflow-hidden ring-1 ring-black/5 shadow-inner">
                        <!-- Phaser Renders Here -->
                    </div>
                </div>

                <!-- D-Pad Pill -->
                <div class="flex items-center gap-8 bg-surface-container-low p-4 px-10 rounded-full shadow-inner border border-surface-container-high">
                    <button id="btn-hold" class="w-14 h-14 bg-surface-container-highest rounded-xl spring-active flex flex-col items-center justify-center text-on-surface shadow-sm hover:bg-surface-container-high transition-colors hand-drawn-border wobbly-line">
                        <span class="material-symbols-outlined text-xl">rotate_right</span>
                        <span class="text-[8px] font-bold uppercase tracking-widest mt-1 opacity-40">HOLD</span>
                    </button>
                    
                    <div class="grid grid-cols-3 grid-rows-2 gap-3">
                        <button id="btn-rotate" class="col-start-2 row-start-1 w-14 h-14 bg-white rounded-full spring-active flex items-center justify-center shadow-md text-primary border-2 border-primary/20 hover:scale-105 transition-transform hand-drawn-border wobbly-line">
                            <span class="material-symbols-outlined text-2xl leading-none">keyboard_arrow_up</span>
                        </button>
                        <button id="btn-left" class="col-start-1 row-start-2 w-14 h-14 bg-white rounded-full spring-active flex items-center justify-center shadow-md text-primary border-2 border-primary/20 hover:scale-105 transition-transform hand-drawn-border wobbly-line">
                            <span class="material-symbols-outlined text-2xl leading-none">keyboard_arrow_left</span>
                        </button>
                        <button id="btn-down" class="col-start-2 row-start-2 w-14 h-14 bg-white rounded-full spring-active flex items-center justify-center shadow-md text-primary border-2 border-primary/20 hover:scale-105 transition-transform hand-drawn-border wobbly-line">
                            <span class="material-symbols-outlined text-2xl leading-none">keyboard_arrow_down</span>
                        </button>
                        <button id="btn-right" class="col-start-3 row-start-2 w-14 h-14 bg-white rounded-full spring-active flex items-center justify-center shadow-md text-primary border-2 border-primary/20 hover:scale-105 transition-transform hand-drawn-border wobbly-line">
                            <span class="material-symbols-outlined text-2xl leading-none">keyboard_arrow_right</span>
                        </button>
                    </div>

                    <button id="btn-drop" class="w-16 h-16 bg-primary text-on-primary rounded-full spring-active flex flex-col items-center justify-center shadow-lg hover:brightness-110 transition-all hand-drawn-border wobbly-line border-white/20">
                        <span class="material-symbols-outlined text-2xl leading-none">keyboard_double_arrow_down</span>
                        <span class="text-[8px] font-black mt-0 tracking-tighter">DROP</span>
                    </button>
                </div>
            </div>

            <!-- Right Side: Next Up & Decoration -->
            <div class="md:col-span-3 space-y-8 flex flex-col">
                <div class="bg-surface-container-low rounded-lg p-6 flex flex-col items-center">
                    <span class="label-caps text-xs font-bold tracking-widest text-on-surface-variant mb-4 uppercase">Next</span>
                    <div id="next-piece-container" class="w-24 h-24 bg-surface-container-highest rounded-xl flex items-center justify-center relative overflow-hidden transition-all duration-300">
                        <!-- Piece Preview from JS -->
                    </div>
                </div>
                <div class="rounded-xl overflow-hidden aspect-square relative group shadow-sm border-2 border-white/40 transform rotate-1 hover:rotate-0 transition-transform duration-500 shadow-xl">
                    <img alt="Cute decoration" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBmafBMpOsnk74oCH3Z_nkfsjfaabMMXiEEaYU7QXwGXkkEVfWvIJUbBF8n_9gVTMu6cKQHgKzTrXKrqgejYtIbFFo8Re9S4nlifvh3h2vaz04HcUPnJhIq3ejX8cYJ61i8wTxdlA72RcjP2ukaY6U60xkXxmLt-eTwQq1Ko7xB4B9_RaMdLlpVIbYpOLBEwiYQ7cTaYLnZKrwGKbQf6d4tvM9LjitlycYktkQulV_Dn7waEThYSWcQ-5SfJU44vFeFZY1M1x4Oag"/>
                    <div class="absolute inset-0 bg-gradient-to-t from-surface-container-low/80 to-transparent"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-surface-container-low w-full py-6 px-10 flex flex-col md:flex-row justify-between items-center gap-4 text-sm italic opacity-40 mt-auto border-t border-surface-container-high font-body">
        <div>© 2024 Tactile Playroom :)</div>
        <div class="flex gap-10">
            <a class="hover:text-primary transition-colors underline" href="#">How to Play</a>
            <a class="hover:text-primary transition-colors underline" href="#">Privacy</a>
            <a class="hover:text-primary transition-colors underline" href="#">Blocks</a>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="game.js"></script>
</body>
</html>
